$kind: http-request
name: Update Task
method: PATCH
url: '{{baseUrl}}/tasks/:id'
order: 5000
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated task title",
      "status": "completed"
    }
